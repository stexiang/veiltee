# VeilTEE 统一配置 —— 所有层读同一份，保证 attestation / 属性 / 指纹一致
enabled=1

# RootOfTrust（三绿）
device_locked=1
boot_state=0
security_level=1

# 补丁级别伪装
os_version=16
patch_level=2026-11-05

# 留空则从 /data/adb/veiltee/vb_key、vb_hash 读取（post-fs-data.sh 落盘）
vb_key=
vb_hash=

state_dir=/data/adb/veiltee
keybox=/data/adb/modules/veiltee/config/keybox.xml
